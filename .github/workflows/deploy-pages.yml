name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels nothing, it just waits.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Projects to build and publish. Each is a folder in the repo root with
  # "npm run build" producing dist/. Add a new project by appending its folder name.
  PROJECTS: english claude-code claude-desktop ai-engineer system-design spring-boot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Build all projects
        run: |
          set -euo pipefail
          mkdir -p site
          for p in $PROJECTS; do
            echo "::group::Build $p"
            (cd "$p" && npm ci && npm run build)
            cp -r "$p/dist" "site/$p"
            echo "::endgroup::"
          done

      - name: Copy root index
        run: cp index.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
